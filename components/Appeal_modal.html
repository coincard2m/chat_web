<div class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm p-4 flex items-center justify-center">
    <div class="bg-white dark:bg-[#211F26] w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform transition-all duration-300 scale-100">
        <div class="p-6 border-b border-gray-100 dark:border-[#49454F]/50 flex justify-between items-center">
            <h3 class="text-xl font-bold text-gray-900 dark:text-[#E6E0E9] flex items-center gap-2">
                <span class="text-2xl">⚖️</span> Gửi Đơn Kháng Cáo
            </h3>
            <button onclick="closeAppealModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 dark:bg-[#36343B] dark:hover:bg-[#49454F] flex items-center justify-center text-gray-500 dark:text-[#CAC4D0] font-bold transition">✕</button>
        </div>
        <div class="p-6 space-y-4">
            <p class="text-[15px] text-gray-600 dark:text-[#CAC4D0]">Bạn đang kháng cáo cho báo cáo có mã: <strong id="appeal-report-id" class="text-indigo-600 dark:text-indigo-400"></strong>.</p>
            <p class="text-sm text-gray-500">Mọi thông tin bạn cung cấp sẽ được AI phân tích và đối chiếu với báo cáo gốc để hỗ trợ Ban giám hiệu đưa ra quyết định công bằng nhất.</p>
            
            <textarea id="appeal-content" rows="5" class="w-full px-4 py-3 border border-gray-200 dark:border-[#49454F]/50 rounded-2xl text-[15px] focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-transparent text-gray-800 dark:text-[#E6E0E9]" placeholder="Giải thích rõ sự việc từ góc nhìn của bạn... Hãy cung cấp bằng chứng hoặc nhân chứng nếu có."></textarea>
            
            <div id="appeal-error" class="hidden text-sm text-red-500 font-medium">Vui lòng nhập nội dung kháng cáo.</div>
        </div>
        <div class="p-6 border-t border-gray-100 dark:border-[#49454F]/50 flex justify-end gap-3 bg-gray-50 dark:bg-[#1C1B1F]">
            <button onclick="closeAppealModal()" class="px-5 py-2.5 rounded-xl font-medium text-gray-600 dark:text-[#CAC4D0] hover:bg-gray-200 dark:hover:bg-[#36343B] transition">Hủy</button>
            <button id="submit-appeal-btn" onclick="submitAppeal()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition flex items-center gap-2">
                Gửi Kháng Cáo
            </button>
        </div>
    </div>
</div>
