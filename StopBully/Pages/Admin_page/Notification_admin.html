<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo hệ thống</title>

    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/main.css"> <!--Css chính cho trang-->
    <link rel="stylesheet" href="/css/User_css/Notification.css">
    <link rel="stylesheet" href="/css/Account_page.css">
    <link rel="stylesheet" href="/css/Admin_css/navbar_admin.css">

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam:wght@400;500;600;700&display=swap">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class',
            content: [],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Be Vietnam', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 dark:bg-[#141218] text-gray-800 dark:text-[#E6E0E9] antialiased">
    <div id="navbar"></div>

    <!-- Thanh tiêu đề Sticky đồng bộ màu tím nhạt và Blur nhẹ -->
    <div class="sticky top-0 z-40 bg-white/80 dark:bg-[#141218]/80 backdrop-blur-md border-b border-gray-100 dark:border-[#49454F]/50 px-4 sm:px-6 py-4 flex items-center justify-between min-h-[72px]">
        <div></div>
    

        <button onclick="openCreateNotificationModal()" 
            class=" bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-[15px] font-semibold px-4 py-2.5 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-indigo-900/20 flex items-center gap-2 transition-all z-50 p-6">
            Gửi thông báo
        </button>
    </div>

    

    <!-- Khu vực nội dung chính -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="grid lg:grid-cols-[1.15fr_0.85fr] gap-6 items-start">
            
            <!-- Danh sách tin nhắn bên trái -->
            <section class="bg-white dark:bg-[#211F26] rounded-3xl border border-gray-100 dark:border-[#49454F]/50/80 shadow-sm p-4 sm:p-6 transition-all">
                <div class="flex items-center justify-between mb-5">
                    <h3 class="text-lg font-bold text-gray-900 dark:text-[#E6E0E9]">Danh sách tin nhắn</h3>
                    <!-- Badge đếm tin nhắn chưa đọc màu Tím phong cách Admin -->
                    <span id="unread-count" class="text-xs font-bold text-indigo-700 bg-indigo-50 border border-indigo-100/50 dark:border-indigo-800 px-3 py-1.5 rounded-xl transition-all">
                        0 Thông báo
                    </span>
                </div>
                <!-- Danh sách động sẽ render tại đây -->
                <div id="message-list" class="space-y-3"></div>
            </section>

            <!-- Xem chi tiết tin nhắn bên phải -->
            <aside id="message-detail" class="bg-white dark:bg-[#211F26] rounded-3xl border border-gray-100 dark:border-[#49454F]/50/80 shadow-sm p-6 min-h-[460px] flex flex-col items-center justify-center text-center text-gray-400 font-medium transition-all sticky top-24">
                <div class="w-16 h-16 bg-indigo-50/60 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl mb-4 border border-indigo-100/30">
                    ✉️
                </div>
                <p class="text-[15px] max-w-xs text-gray-500 dark:text-[#CAC4D0] leading-relaxed">
                    Chọn một tin nhắn bất kỳ từ danh sách bên cạnh để đọc nội dung chi tiết.
                </p>
            </aside>
            
        </div>
    </div>

    <div id="modal-container"></div>
    <div id="footer"></div>

    <script type="module" src="/js/Admin_js/Notification_admin.js"></script>
    <script defer src="/js/Admin_js/load_components_admin.js"></script>
    <script defer src="/js/navbar.js"></script>
    <script src="/js/Admin_js/Setting_admin.js"></script>
    <script src="/js/Account.js"></script>
    
</body>
</html>
