<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo</title>

    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/main.css"> <!--Css chính cho trang-->
    <link rel="stylesheet" href="/css/User_css/Notification.css">
    <link rel="stylesheet" href="/css/Account_page.css">

    <!-- Google Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam:wght@400;500;600;700&display=swap">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = { darkMode: 'class',
            content: [],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Be Vietnam', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 dark:bg-[#141218] text-gray-800 dark:text-[#E6E0E9]">
    <div id="navbar"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        <div class="grid lg:grid-cols-[1.15fr_0.85fr] gap-6">
            <section class="bg-white dark:bg-[#211F26] rounded-3xl shadow p-4 sm:p-6">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-[#E6E0E9]">Danh sách tin nhắn</h3>
                    <span id="unread-count" class="text-sm font-medium text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">0 Thông báo</span>
                </div>
                <div id="message-list" class="space-y-3"></div>
            </section>

            <aside id="message-detail" class="bg-white dark:bg-[#211F26] rounded-3xl shadow p-6 min-h-[420px] flex items-center justify-center text-gray-500 dark:text-[#CAC4D0]">
                Chọn một tin nhắn để xem nội dung chi tiết.
            </aside>
        </div>
    </div>

    <div id="modal-container"></div>
    <!-- Footer -->
    <div id="footer"></div>

    <script defer src="/js/load_components.js"></script>
    <script defer src="/js/navbar.js"></script>
    <script type="module" src="/js/User_js/Report_component.js"></script>
    <script type="module" src="/js/User_js/Tracker_component.js"></script>
    <script type="module" src="/js/User_js/Notification.js"></script>
    <script type="module" src="/js/User_js/Appeal.js"></script>
    <script src="/js/Account.js"></script>
    <script src="/js/User_js/Setting.js"></script>
</body>
</html>
